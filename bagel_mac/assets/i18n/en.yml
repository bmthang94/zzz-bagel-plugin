# 弹窗
先完成「开始前」的 4 项检查。其他规则可按需展开。: Complete the 4 checks under "Before you start" first. Expand other sections as needed.
"入箱：将物品装入局内安全箱。\n入仓：将携带物存入贝果仓库。\n空箱：结算开始时安全箱为空。": "Load into briefcase: put items into the in-run briefcase.\nDeposit to warehouse: put carried items into the Operation Bagel warehouse.\nEmpty briefcase: the briefcase is empty when settlement starts."
困难和常规需要换路线: Hard and Standard need different routes
"1. 困难和常规会刷出「助战物资」，沿用高危路线时可能卡在这些物资上。\n2. 天赋未满时，卸下装备后的血量也不够跑完较长路线。\n\n请在路线编辑器中改开「录像店-非高危」和「白鸽工地站-非高危」，\n并关闭其他出生点。\n点确定不会自动切换路线。": "1. Hard and Standard spawn assist supplies that a High-Risk route can get stuck on.\n2. When talents are not maxed, HP without gear may not last through longer routes.\n\nIn the route editor, enable \"Random Play-Non-High-Risk\" and \"Dove Street Construction Site Station-Non-High-Risk\",\nand disable the other spawn points.\nClicking OK does not switch routes automatically."

