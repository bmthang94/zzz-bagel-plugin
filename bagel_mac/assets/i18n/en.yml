# 使用说明（usage.py，弹窗按节展示）
开始前: Before you start
解锁入口: Unlock the entry
解锁贝果计划快捷手册入口及「录像店－房间」传送点。首次入场时，程序先传送到该地点，再从快捷手册进入贝果。: Unlock the Operation Bagel shortcut in the handbook and the "Random Play - Room" teleport point. On the first entry, the app teleports there first, then enters Bagel via the handbook.
预留空位: Reserve space
给贝果仓库预留空位。: Leave free space in the Operation Bagel warehouse.
选择角色: Choose an agent
尽量不用有特殊移动方式的角色，如星见雅、叶瞬光。这类移动可能影响导航和定位。: Avoid agents with special movement, such as 星见雅 and 叶瞬光; it can break navigation and positioning.
核对设置: Check the settings
设置只用于当前账号和应用组。切换后，请核对模式、地图、难度、次数、蓝图优先、自动出售和出售范围。: Settings apply only to the current account and app group. After switching, check the mode, map, difficulty, counts, blueprint priority, auto-sell, and sell scope.
挑战难度: Difficulty
默认高危。可选常规、困难、高危。常规的推荐装备价值是 12000，困难是 72100，高危是 258000。: High-Risk by default. Standard, Hard, and High-Risk are available. Recommended gear value is 12000 for Standard, 72100 for Hard, and 258000 for High-Risk.
非高危路线: Non-High-Risk routes
切到困难或常规时会提示换路线，确定前需等待 10 秒。请改开「录像店-非高危」和「白鸽工地站-非高危」，并关闭其他出生点。点确定不会自动改开启选择，已有的开启选择也不会因新路线发布而改变。高危路线在困难或常规里可能卡在助战物资上；天赋未满时，卸装后的血量也不够跑完较长路线。: Switching to Hard or Standard shows a route-change notice with a 10-second wait before confirming. Enable "Random Play-Non-High-Risk" and "Dove Street Construction Site Station-Non-High-Risk" and disable other spawn points. Confirming does not change selections for you, and new route releases never change existing selections. High-Risk routes can stall on assist supplies in Hard or Standard; when talents are not maxed, HP without gear may not last through longer routes.
何时结束: When it ends
成功次数：0–1000: "Success count: 0-1000"
填 0 表示不限。成功入仓且结算检查通过后计数；失败局和空箱局不计。达到上限后，程序完成结算和返回，再结束任务。: 0 means no limit. A run counts only after a successful deposit and settlement check; failed and empty-briefcase runs do not count. Once the limit is reached, the app finishes settlement and returns, then ends the task.
连续失败次数：1–10: "Consecutive failures: 1-10"
失败后，程序先退出并结算。全局或同一路线连续失败达到上限则停止，否则重开。填 1 表示首次失败结算后停止。: After a failure, the app exits and settles first. It stops when global or per-route consecutive failures reach the limit, otherwise it retries. 1 means stop after the first failed run settles.
计数方式: How counting works
成功次数按本次任务累计。成功入仓后，全局和这条路线的连续失败清零，其他路线的计数保留。空箱局和非支持出生点既不增加也不清零；暂停恢复不清零；新任务重新计数。: Success counts accumulate within this task. After a successful deposit, the global counter and this route's consecutive failures reset; other routes keep theirs. Empty-briefcase and unsupported-spawn runs neither add nor reset; pausing and resuming does not reset; a new task starts over.
提前停止: Early stop
未达到次数上限时，程序也可能停止。条件见「满仓或异常」。: The task may also stop before the limits are reached. See "Warehouse full or errors".
默认开启: On by default
蓝图优先于非蓝图。多张蓝图按 Z、S、A、B、C、未知的顺序选择，同品质不对换。: Blueprints beat non-blueprints. Multiple blueprints are picked in Z, S, A, B, C, unknown order; same quality is not swapped.
满箱对换: Swapping when full
蓝图先换出最低优先级非蓝图，不受品质限制。箱内全是蓝图时，只用更高品质蓝图对换。: A blueprint first swaps out the lowest-priority non-blueprint regardless of quality. When the briefcase is all blueprints, only a higher-quality blueprint swaps in.
叠放与件数: Stacking and count
材料和战术道具先叠到箱内同一种上，不占新格。箱满且优先级相同时，件数更多的一格才换入。: Materials and tactical items stack onto the same kind in the briefcase without taking a new slot. When full and priorities tie, the slot with more items swaps in.
特殊奖励: Special rewards
特殊奖励指菲林、零号业绩。同品质时高于贵重物品，但不跨品质优先；开启本开关时仍低于蓝图。: Special rewards are Polychrome and Zero performance. Same-quality they outrank valuables but never cross quality; with this switch on they still rank below blueprints.
关闭开关: With the switch off
先比非材料，再比品质和类型。同品质时，特殊奖励 > 贵重物品 > 蓝图 > 门禁卡 > 战术棱镜 > 装备 > 战术道具 > 其他。: "Non-materials are compared first, then quality and type. At the same quality: special rewards > valuables > blueprints > keycards > tactical prisms > gear > tactical items > others."
识别限制: Recognition limits
只看物品格角标，不按名称或解锁状态判断。角标未识别时按其他处理，无法保证蓝图优先。: Only the corner badge of each item slot is read, not names or unlock state. Unrecognized badges count as others, so blueprint priority is not guaranteed.
仅影响局内入箱: In-run loading only
不改变收集范围，不因获得蓝图停止。仓库是否出售取决于自动出售开关和出售方案。: It does not change what is collected, and the task does not stop on finding a blueprint. Whether the warehouse sells depends on the auto-sell switch and sell plan.
出售哪些物品: What gets sold
出售风险: Sell risk
范围包含已有库存。安全箱内符合条件的物品也可能被出售。: The scope includes existing stock. Briefcase items that qualify may also be sold.
默认方案: Default plan
先出售贵重物品、战术棱镜的 C/B/A/S 品质，再出售其他物品的 C/B/A 品质。S 品质其他物品保留，包括金色蓝图和材料；同时保留全部 Z 品质、装备、战术道具和门禁卡。: First sells C/B/A/S quality valuables and tactical prisms, then C/B/A quality others. S-quality others are kept, including gold blueprints and materials; all Z quality, gear, tactical items, and keycards are also kept.
自定义方案: Custom plan
每步至少选一种类型和一种品质。物品同时符合两项才出售。选择 Z 品质或装备时，也按此规则出售。步骤按从上到下的顺序执行。选择其他类型和 S 品质时，金色蓝图和 S 品质材料也会出售。切换方案不清空自定义步骤。: Each step needs at least one type and one quality; items are sold only when both match. Choosing Z quality or gear sells them by the same rule. Steps run top to bottom. Choosing others plus S quality also sells gold blueprints and S-quality materials. Switching plans keeps your custom steps.
选项不完整: Incomplete options
开启自动出售时，自定义方案没有步骤或有步骤未选全，任务无法启动。: With auto-sell on, the task cannot start when the custom plan has no steps or incomplete steps.
关闭自动出售: Auto-sell off
只入仓，不出售。首次入场仍清空携带物。: Deposit only, nothing is sold. The first entry still clears carried items.
何时出售: When selling happens
出售间隔：1–999: "Sell interval: 1-999"
只计有物品且全部入仓的次数，失败局也计入。空箱和出生点重选不计。暂停或失败重开不清零；新任务重新计数。: Only deposits that held items and stored everything count, including failed runs. Empty-briefcase and spawn reroll runs do not count. Pauses and failure retries do not reset; a new task starts over.
出售完成: Sell done
用于出售间隔的入仓次数归零。筛选到 0 件并正常取消，也归零。: The deposit counter used for the interval resets. Selecting 0 items through the filter and cancelling normally also resets it.
达到成功上限: Reaching the success limit
最后一个有物品的结算未到间隔，也会出售。手动或异常结束不追加出售；失败局仍按间隔处理。: The last non-empty settlement sells even if the interval is not reached. Manual or abnormal endings add no extra sell; failed runs still follow the interval.
出售上限: Sell limit
同一结算最多出售一轮。一轮包含方案的全部步骤，步骤之间不再入仓。: At most one sell round per settlement. A round runs every step of the plan; nothing is deposited between steps.
首次入场会清空背包并卸下装备: First entry clears the backpack and unequips gear
自动清空: Auto-clearing
背包和安全箱内物品先转存仓库。随后卸下装备。每次任务仅首次入场前允许自动清空。暂停恢复不重置此限制。: Backpack and briefcase items are stored into the warehouse first, then gear is unequipped. Auto-clearing is allowed only before the first entry of each task; pausing and resuming does not reset this.
每次入场前: Before every entry
程序核对已装备槽位为空，背包和安全箱占用为 0。高危再核对投资金额为 0。困难和常规不要求投资确认；若仍出现投资页，程序仍按零投资处理。读数或提示不明时停止。后续局发现非零携带时停止，不再次清空。: The app checks that equipped slots are empty and backpack and briefcase usage is 0. High-Risk also checks investment is 0. Hard and Standard do not require it; if an investment page still shows, it is treated as zero. Unclear readings or prompts stop the task. Later runs that find non-zero carry stop instead of clearing again.
从局内启动: Starting inside a run
程序先退出，不继续当前局。退出只保留安全箱内物品。: The app exits first and does not continue the current run; exiting keeps only briefcase items.
启动时转存: Transfer at startup
遗留物品不计成功次数、失败次数或出售间隔。通常不出售；满仓或物品未存完时，见「满仓或异常」。: Leftover items do not count toward successes, failures, or the sell interval. They are usually not sold; when the warehouse is full or items remain unstored, see "Warehouse full or errors".
满仓或异常: Warehouse full or errors
满仓或物品未存完: Warehouse full or items left over
开启自动出售时，程序可按方案提前出售一轮。还有物品未存入仓库时，再入仓一次。重试后仍有物品未存完，或状态不明时停止。: With auto-sell on, the app may sell one round early by plan. If items remain unstored, it deposits once more. If items are still left after the retry, or the state is unclear, it stops.
是否继续: Whether it continues
安全箱为空且仓库容量可读时，即使满仓也可继续。关闭自动出售时，仍有物品或状态不明则停止。: With an empty briefcase and a readable warehouse capacity, the task continues even when full. With auto-sell off, leftover items or an unclear state stops it.
空箱: Empty briefcase
不出售，仍核对安全箱和仓库容量。连续 3 次空箱结算后停止重开。: Nothing is sold, but the briefcase and warehouse capacity are still checked. Three empty-briefcase settlements in a row stop the retries.
出生点重选: Spawn reroll
不计失败，也没有重选次数上限。需要结束时，请手动停止。: Rerolls do not count as failures and have no retry limit. Stop the task manually to end it.
操作失败: Operation failure
退出、入仓、出售或返回失败时，程序立即停止，不再重开。请先查看日志中的停止原因。: If exiting, depositing, selling, or returning fails, the app stops immediately and does not retry. Check the stop reason in the log first.

